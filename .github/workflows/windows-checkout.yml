name: Legacy Windows checkout

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-checkout.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Windows checkout regressions
        run: node --test test/windows-checkout-regression.test.cjs
      - name: Existing React tests
        run: CI=true npm test -- --watch=false --runInBand
      - name: Bundle
        run: CI=false npm run build
