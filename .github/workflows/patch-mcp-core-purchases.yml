name: Patch MCP core purchases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run MCP core purchase merger') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge purchase MCP tools into mcpCore.js
        run: |
          node <<'NODE'
          const fs = require('fs');
          const corePath = 'api/_lib/mcpCore.js';
          const mcpPath = 'api/mcp.js';
          let s = fs.readFileSync(corePath, 'utf8');

          const readNames = '"get_purchases","get_purchase_by_id","get_purchase_history","get_purchase_breakdown","get_suppliers"';
          if (!s.includes('"get_purchase_history"')) {
            s = s.replace('"get_expenses_report","get_expenses","get_expense_by_id","get_purchases_report","get_month_expenses_report","get_year_expenses_report"', '"get_expenses_report","get_expenses","get_expense_by_id","get_purchases_report",' + readNames + ',"get_month_expenses_report","get_year_expenses_report"');
          }

          const writeNames = '"add_purchase","update_purchase","void_purchase","add_purchase_category","update_purchase_category","disable_purchase_category","add_supplier","update_supplier","disable_supplier"';
          if (!s.includes('"add_purchase"')) {
            s = s.replace('"add_expense","update_expense","void_expense","delete_expense"', '"add_expense","update_expense","void_expense","delete_expense",' + writeNames);
          }

          if (!s.includes('"void_purchase"') || !s.includes('TOOL_SCOPES[t] = "write:expenses";')) {
            throw new Error('Core tool scope area not found.');
          }
          if (!s.includes('"add_purchase","update_purchase","void_purchase"')) {
            s = s.replace('for (const t of ["add_expense","update_expense","void_expense","delete_expense","add_bank_transaction","withdraw_from_bank","deposit_to_bank","adjust_bank_total"]) TOOL_SCOPES[t] = "write:expenses";', 'for (const t of ["add_expense","update_expense","void_expense","delete_expense","add_purchase","update_purchase","void_purchase","add_purchase_category","update_purchase_category","disable_purchase_category","add_supplier","update_supplier","disable_supplier","add_bank_transaction","withdraw_from_bank","deposit_to_bank","adjust_bank_total"]) TOOL_SCOPES[t] = "write:expenses";');
          }

          const helper = String.raw`
const PURCHASE_READ_TOOLS = new Set(["get_purchases_report","get_purchases","get_purchase_by_id","get_purchase_history","get_purchase_breakdown","get_suppliers"]);
const PURCHASE_WRITE_TOOLS = new Set(["add_purchase","update_purchase","void_purchase","add_purchase_category","update_purchase_category","disable_purchase_category","add_supplier","update_supplier","disable_supplier"]);
function purchaseRows(state={}){ return safeArray(state.purchases).filter(p=>!p.deleted); }
function activePurchaseRows(state={}){ return purchaseRows(state).filter(p=>!p.voided&&!p.archived); }
function purchaseCategoryRows(state={}){ const raw=Array.isArray(state.purchaseCategories)?state.purchaseCategories:[]; return raw.map(c=>typeof c==="string"?{id:asId(c).replace(/[^a-z0-9]+/g,"_")||`cat_${Date.now()}`,name:c,active:true}:c).filter(Boolean); }
function supplierRows(state={}){ const raw=Array.isArray(state.purchaseSuppliers)?state.purchaseSuppliers:Array.isArray(state.suppliers)?state.suppliers:[]; return raw.map(x=>typeof x==="string"?{id:asId(x).replace(/[^a-z0-9]+/g,"_")||`supplier_${Date.now()}`,name:x,active:true}:x).filter(Boolean); }
function purchaseTotal(p={}){ if(p.voided||p.deleted||p.archived) return 0; if(p.total!=null) return money(p.total); if(p.amount!=null) return money(p.amount); return money(num(p.qty??p.quantity,0)*num(p.unitPrice??p.unit_price,0)); }
function purchaseWindow(input={}){ if(input.month){ const raw=String(input.month); if(!/^\d{4}-\d{2}$/.test(raw)) throw new Error("month must be YYYY-MM."); const [y,m]=raw.split("-").map(Number); return {from:+new Date(Date.UTC(y,m-1,1)),to:+new Date(Date.UTC(y,m,1)-1),period:raw}; } if(input.year){ const y=Number(input.year); if(!Number.isInteger(y)) throw new Error("year must be a number."); return {from:+new Date(Date.UTC(y,0,1)),to:+new Date(Date.UTC(y+1,0,1)-1),period:String(y)}; } if(input.start_date||input.end_date){ if(!input.start_date||!input.end_date) throw new Error("start_date and end_date are required."); return {from:+new Date(`${input.start_date}T00:00:00.000Z`),to:+new Date(`${input.end_date}T23:59:59.999Z`),period:`${input.start_date}_${input.end_date}`}; } if(input.date){ return {from:+new Date(`${input.date}T00:00:00.000Z`),to:+new Date(`${input.date}T23:59:59.999Z`),period:input.date}; } return null; }
function filterPurchases(state={},input={}){ let rows=activePurchaseRows(state); const w=purchaseWindow(input); if(w) rows=rows.filter(p=>{ const ms=+new Date(p.date||p.createdAt||0); return Number.isFinite(ms)&&ms>=w.from&&ms<=w.to; }); if(input.category) rows=rows.filter(p=>asId(p.category||p.categoryName||p.categoryId)===asId(input.category)); if(input.supplier) rows=rows.filter(p=>asId(p.supplier||p.supplierName||p.supplierId)===asId(input.supplier)); return rows.sort((a,b)=>+new Date(b.date||b.createdAt||0)-+new Date(a.date||a.createdAt||0)); }
function purchaseBreakdown(rows=[]){ const cat={}, sup={}; for(const p of rows){ const total=purchaseTotal(p); const qty=num(p.qty??p.quantity,0); const c=p.category||p.categoryName||p.categoryId||"Uncategorized"; const sp=p.supplier||p.supplierName||p.supplierId||"Unknown"; if(!cat[c]) cat[c]={category:c,count:0,qty:0,total:0}; if(!sup[sp]) sup[sp]={supplier:sp,count:0,qty:0,total:0}; cat[c].count++; cat[c].qty=money(cat[c].qty+qty); cat[c].total=money(cat[c].total+total); sup[sp].count++; sup[sp].qty=money(sup[sp].qty+qty); sup[sp].total=money(sup[sp].total+total); } return {category_breakdown:Object.values(cat).sort((a,b)=>b.total-a.total),supplier_breakdown:Object.values(sup).sort((a,b)=>b.total-a.total)}; }
function purchaseReport(state={},input={}){ const rows=filterPurchases(state,input); return {period:purchaseWindow(input)?.period||"all",purchases:rows,total_purchases:rows.length,total_amount:money(rows.reduce((sum,p)=>sum+purchaseTotal(p),0)),...purchaseBreakdown(rows)}; }
function buildPurchase(input={},auth={}){ const itemName=compactText(input.item_name||input.itemName||input.name||input.item); if(!itemName) throw new Error("item_name is required."); const qty=pos(input.qty??input.quantity??1,"qty"); const unitPrice=nonNeg(input.unit_price??input.unitPrice??0,"unit_price"); const total=money(input.total??input.amount??qty*unitPrice); const at=nowIso(); return {id:input.id||`mcp_purchase_${Date.now()}`,itemName,name:itemName,category:input.category||input.category_name||input.categoryName||"",supplier:input.supplier||input.supplier_name||input.supplierName||"",qty,quantity:qty,unit:input.unit||"unit",unitPrice,unit_price:unitPrice,total,amount:total,invoiceNumber:input.invoice_number||input.invoiceNumber||"",invoice_number:input.invoice_number||input.invoiceNumber||"",note:input.note||"",date:input.date?new Date(input.date).toISOString():at,createdAt:at,updatedAt:at,voided:false,archived:false,source:"mcp",adminId:auth.mcpContext?.adminId||"",adminName:auth.mcpContext?.adminName||"",syncStatus:"pending",lastModifiedDeviceId:"mcp"}; }
function ensurePurchaseCategory(list=[],name){ const nm=compactText(name); if(!nm||list.some(c=>asId(c.id)===asId(nm)||asId(c.name)===asId(nm))) return list; return [{id:asId(nm).replace(/[^a-z0-9]+/g,"_")||`cat_${Date.now()}`,name:nm,active:true,createdAt:nowIso(),source:"mcp"},...list]; }
function ensureSupplier(list=[],name){ const nm=compactText(name); if(!nm||list.some(s=>asId(s.id)===asId(nm)||asId(s.name)===asId(nm))) return list; return [{id:asId(nm).replace(/[^a-z0-9]+/g,"_")||`supplier_${Date.now()}`,name:nm,active:true,createdAt:nowIso(),source:"mcp"},...list]; }
async function executePurchaseTool(supabase,state,writeSeq,toolName,input={},auth={}){ if(["get_purchases_report","get_purchases","get_purchase_history","get_purchase_breakdown"].includes(toolName)) return purchaseReport(state,input); if(toolName==="get_purchase_by_id"){ const row=purchaseRows(state).find(p=>String(p.id)===String(input.purchase_id||input.id)); if(!row) throw new Error("Purchase was not found."); return row; } if(toolName==="get_suppliers") return {suppliers:supplierRows(state)}; if(toolName==="add_purchase"){ const row=buildPurchase(input,auth); const next={...state,purchases:[row,...purchaseRows(state)],purchaseCategories:ensurePurchaseCategory(purchaseCategoryRows(state),row.category),purchaseSuppliers:ensureSupplier(supplierRows(state),row.supplier)}; const saved=await saveShopState(supabase,next,writeSeq); return {purchase:row,purchase_report:purchaseReport(saved,{}),__audit:{beforeState:null,afterState:row}}; } if(toolName==="update_purchase"){ const pid=input.purchase_id||input.id; const before=purchaseRows(state).find(p=>String(p.id)===String(pid)); if(!before) throw new Error("Purchase was not found."); const rows=purchaseRows(state).map(p=>{ if(String(p.id)!==String(pid)) return p; const qty=input.qty!=null?nonNeg(input.qty,"qty"):num(p.qty??p.quantity,0); const unitPrice=input.unit_price!=null?nonNeg(input.unit_price,"unit_price"):num(p.unitPrice??p.unit_price,0); const itemName=input.item_name??input.itemName??p.itemName??p.name; const total=money(input.total??input.amount??qty*unitPrice); return {...p,itemName,name:itemName,category:input.category??p.category,supplier:input.supplier??p.supplier,qty,quantity:qty,unit:input.unit??p.unit,unitPrice,unit_price:unitPrice,total,amount:total,invoiceNumber:input.invoice_number??input.invoiceNumber??p.invoiceNumber,invoice_number:input.invoice_number??input.invoiceNumber??p.invoice_number,note:input.note??p.note,updatedAt:nowIso(),syncStatus:"pending",lastModifiedDeviceId:"mcp"}; }); const saved=await saveShopState(supabase,{...state,purchases:rows},writeSeq); const after=purchaseRows(saved).find(p=>String(p.id)===String(pid)); return {purchase:after,__audit:{beforeState:before,afterState:after}}; } if(toolName==="void_purchase"){ const pid=input.purchase_id||input.id; const before=purchaseRows(state).find(p=>String(p.id)===String(pid)); if(!before) throw new Error("Purchase was not found."); const rows=purchaseRows(state).map(p=>String(p.id)===String(pid)?{...p,voided:true,voidReason:input.reason||"MCP void",updatedAt:nowIso(),syncStatus:"pending",lastModifiedDeviceId:"mcp"}:p); const saved=await saveShopState(supabase,{...state,purchases:rows},writeSeq); const after=purchaseRows(saved).find(p=>String(p.id)===String(pid)); return {purchase:after,safe_delete:true,__audit:{beforeState:before,afterState:after}}; } if(["add_purchase_category","update_purchase_category","disable_purchase_category"].includes(toolName)){ const before=purchaseCategoryRows(state); let rows=before; const name=compactText(input.name||input.category); const target=asId(input.category_id||input.id||name); if(toolName==="add_purchase_category") rows=ensurePurchaseCategory(rows,name); else rows=rows.map(c=>asId(c.id)===target||asId(c.name)===target?{...c,name:input.new_name||name||c.name,active:toolName!=="disable_purchase_category",disabled:toolName==="disable_purchase_category",archived:toolName==="disable_purchase_category",updatedAt:nowIso()}:c); const saved=await saveShopState(supabase,{...state,purchaseCategories:rows},writeSeq); return {purchase_categories:saved.purchaseCategories,__audit:{beforeState:before,afterState:saved.purchaseCategories}}; } if(["add_supplier","update_supplier","disable_supplier"].includes(toolName)){ const before=supplierRows(state); let rows=before; const name=compactText(input.name||input.supplier); const target=asId(input.supplier_id||input.id||name); if(toolName==="add_supplier") rows=ensureSupplier(rows,name); else rows=rows.map(sp=>asId(sp.id)===target||asId(sp.name)===target?{...sp,name:input.new_name||name||sp.name,phone:input.phone??sp.phone,email:input.email??sp.email,address:input.address??sp.address,note:input.note??sp.note,active:toolName!=="disable_supplier",disabled:toolName==="disable_supplier",archived:toolName==="disable_supplier",updatedAt:nowIso()}:sp); const saved=await saveShopState(supabase,{...state,purchaseSuppliers:rows},writeSeq); return {suppliers:saved.purchaseSuppliers,__audit:{beforeState:before,afterState:saved.purchaseSuppliers}}; } throw new Error(`Unsupported purchase tool: ${toolName}`); }
`;

          if (!s.includes('function purchaseRows(')) {
            s = s.replace('function tool(name,description,properties={},required=[]){', helper + '\nfunction tool(name,description,properties={},required=[]){');
          }

          if (!s.includes('Purchase MCP read tool.')) {
            s = s.replace('for(const n of ["get_expenses_report","get_expenses","get_purchases_report"]) defs.push(tool(n,`${read} Returns expenses/purchases.`,{date:{type:"string"}}));', 'for(const n of ["get_expenses_report","get_expenses"]) defs.push(tool(n,`${read} Returns expenses.`,{date:{type:"string"}}));\n  for(const n of ["get_purchases_report","get_purchases","get_purchase_history","get_purchase_breakdown","get_suppliers"]) defs.push(tool(n,`${read} Purchase MCP read tool.`,{date:{type:"string"},month:{type:"string"},year:{type:"number"},start_date:{type:"string"},end_date:{type:"string"},supplier:{type:"string"},category:{type:"string"}}));\n  defs.push(tool("get_purchase_by_id",`${read} Returns one purchase.`,{purchase_id:{type:"string"}},["purchase_id"]));\n  for(const n of ["add_purchase","update_purchase","void_purchase","add_purchase_category","update_purchase_category","disable_purchase_category","add_supplier","update_supplier","disable_supplier"]) defs.push(tool(n,`${write} Purchase MCP write tool. Uses safe void/disable instead of hard delete.`,{purchase_id:{type:"string"},item_name:{type:"string"},name:{type:"string"},category:{type:"string"},supplier:{type:"string"},qty:{type:"number"},unit:{type:"string"},unit_price:{type:"number"},invoice_number:{type:"string"},reason:{type:"string"},note:{type:"string"}}));');
          }

          if (!s.includes('executePurchaseTool(supabase,state,writeSeq,toolName,input,auth)')) {
            s = s.replace('if(toolName==="get_expenses_report"||toolName==="get_expenses") return expensesReport(state,dateWindowFor(state,input.date));', 'if(PURCHASE_READ_TOOLS.has(toolName)||PURCHASE_WRITE_TOOLS.has(toolName)) return executePurchaseTool(supabase,state,writeSeq,toolName,input,auth);\n  if(toolName==="get_expenses_report"||toolName==="get_expenses") return expensesReport(state,dateWindowFor(state,input.date));');
          }

          fs.writeFileSync(corePath, s);
          fs.writeFileSync(mcpPath, 'const { handleMcp } = require("./_lib/mcpCore");\n\nmodule.exports = handleMcp;\n');
          NODE
      - name: Syntax check
        run: node --check api/_lib/mcpCore.js
      - name: Commit direct core patch
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/mcpCore.js api/mcp.js .github/workflows/patch-mcp-core-purchases.yml
          git commit -m "Merge purchase MCP tools into core"
          git push
